name: Refresh market data

on:
  schedule:
    # Every 15 minutes, 13:00–21:00 UTC on weekdays (US market hours) plus a
    # couple of after-close runs so the page is never badly stale.
    - cron: "*/15 13-21 * * 1-5"
    - cron: "0 22,2 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch live quotes
        run: bun scripts/fetch-market-data.ts

      - name: Publish data to gh-pages
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('public/data/market.json', 'base64');
            let sha;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'data/market.json',
                ref: 'gh-pages',
              });
              sha = data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'data/market.json',
              message: 'Refresh market data',
              content,
              sha,
              branch: 'gh-pages',
            });


